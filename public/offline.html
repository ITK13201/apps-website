<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline - ITK Apps</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Noto Sans JP", -apple-system, BlinkMacSystemFont, sans-serif;
        background-color: #f9fafb;
        color: #111827;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 1rem;
      }
      .container {
        text-align: center;
        max-width: 400px;
      }
      .icon {
        font-size: 4rem;
        margin-bottom: 1.5rem;
      }
      h1 {
        font-size: 1.5rem;
        font-weight: 700;
        margin-bottom: 0.75rem;
      }
      p {
        color: #6b7280;
        line-height: 1.6;
        margin-bottom: 2rem;
      }
      a {
        display: inline-block;
        padding: 0.75rem 1.5rem;
        background-color: #0071e3;
        color: white;
        text-decoration: none;
        border-radius: 0.75rem;
        font-weight: 500;
        transition: background-color 0.2s;
      }
      a:hover {
        background-color: #0062c6;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="icon">📡</div>
      <h1>オフラインです</h1>
      <p>
        インターネット接続がありません。<br />
        接続を確認して、もう一度お試しください。
      </p>
      <a href="/">ホームへ戻る</a>
    </div>
  </body>
</html>
